<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#243c36" />
    <meta name="description" content="序隅 XUYU 客户顾问话术工作台。虚构品牌与资料，仅供演示。" />
    <title>序隅 XUYU · 顾问工作台</title>
    <script>
      (() => {
        const themes = ['forest', 'obsidian', 'gallery', 'atelier'];
        let selected = 'forest';
        try {
          const query = new URLSearchParams(location.search).get('theme');
          const saved = localStorage.getItem('xuyu.visual-theme.v1');
          selected = themes.includes(query) ? query : themes.includes(saved) ? saved : selected;
        } catch {}
        document.documentElement.dataset.theme = selected;
        document.documentElement.style.colorScheme = selected === 'obsidian' ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

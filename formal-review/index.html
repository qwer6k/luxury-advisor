<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序隅 · 正式审稿</title><style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#213f36;background:#f7f5ef;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select,textarea,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #bcc7be;background:#fcfbf6;color:#23483c;padding:10px 15px;border-radius:5px}button:hover{background:#e6ece3}header{padding:23px 32px;border-bottom:1px solid #d9ddd2;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-family:Georgia,"Songti SC",serif;font-size:27px;margin:2px 0 8px;font-weight:500}.eyebrow{font-size:10px;letter-spacing:3px;color:#a37d42}small,.muted{color:#6f8075;line-height:1.7}a{color:#345b4a}nav{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:80vh}aside{padding:22px 18px;background:#edf0e7;border-right:1px solid #d9ddd2}aside select{width:100%;padding:9px;border:1px solid #ccd3c6;background:#fbfcf7}#caseList{display:grid;gap:6px;margin-top:16px}.case-button{text-align:left;border:0;background:transparent;padding:9px}.case-button.active{background:#21483b;color:#fff}.case-button small{display:block;color:inherit;opacity:.75;margin-top:5px}main{padding:28px 32px;min-width:0;max-width:1450px}h2{font-family:Georgia,"Songti SC",serif;font-size:28px;font-weight:400;margin:0 0 15px}h3{font-size:15px;margin:0 0 12px;font-weight:500}.context{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.panel{background:#fffef9;border:1px solid #e1e3d9;padding:18px;border-radius:7px}.context p{margin:5px 0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.history{border-left:2px solid #d0b17c;padding-left:12px}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.message{font-family:"Songti SC",serif;font-size:18px;line-height:1.9;white-space:pre-wrap;min-height:180px;overflow-wrap:anywhere}.candidate-number{font-size:11px;letter-spacing:2px;color:#947440}.rating label{display:block;margin:10px 0 7px}.rating select,.rating textarea{width:100%;border:1px solid #ccd2c6;border-radius:4px;padding:9px;background:#fffefb;color:#243e34}.rating textarea{height:100px;resize:vertical}.scores{display:grid;grid-template-columns:1fr 1fr;gap:7px}.scores label{font-size:11px}.scores input{width:100%;padding:5px;border:1px solid #ccd2c6}.ai{font-size:12px;line-height:1.8;white-space:pre-wrap;color:#645942;background:#f5efdf;padding:12px;margin-top:12px;border-radius:4px}details{margin-top:14px}summary{cursor:pointer;color:#7c6944}#status{color:#6c7a6b;margin-top:14px;font-size:12px;line-height:1.7}#feedback{padding:10px 32px;color:#8b4e38;min-height:0}footer{padding:25px 32px;border-top:1px solid #d9ddd2;color:#7b897d;font-size:11px}.topline{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:22px}.tag{font-size:12px;padding:5px 10px;background:#e5ebe1;border-radius:20px}.actions{margin:22px 0;display:flex;gap:9px;justify-content:flex-end}.notice{background:#ecefe5;padding:13px 16px;margin-bottom:20px;line-height:1.8;border-radius:4px}#file{display:none}@media(max-width:1100px){.candidates{grid-template-columns:1fr}.message{min-height:0}.context{grid-template-columns:1fr}.layout{grid-template-columns:175px minmax(0,1fr)}header{align-items:flex-start;flex-wrap:wrap}main{padding:22px}.panel{min-width:0}}@media(max-width:650px){.layout{grid-template-columns:1fr}aside{border-right:0}#caseList{grid-template-columns:repeat(3,minmax(0,1fr));max-height:180px;overflow:auto}header{padding:20px}main{padding:18px}.context{grid-template-columns:1fr}}
</style></head><body><header><div><div class="eyebrow">XUYU · EDITORIAL REVIEW</div><h1>正式审稿 · 让每一句都贴近此人</h1><small>真实生成结果 · AI 初评默认隐藏 · 人工判断单独保存</small></div><nav><button id="export">导出审稿 JSON</button><button id="import">导入已存审稿</button><input id="file" type="file" accept="application/json"><a href="/" style="padding:10px">返回工作台 ↗</a></nav></header><div id="feedback" role="status"></div><div class="layout"><aside><label for="filter">案例范围</label><select id="filter"><option value="sample">固定抽检 · 12 组</option><option value="all">全部正式案例 · 50 组</option><option value="risk">重点风险与争议</option></select><div id="status"></div><div id="caseList"></div></aside><main id="main">正在读取正式数据…</main></div><footer>数据集与候选哈希随导出保留。浏览器自动保存仅在本机生效，请导出 JSON 作为正式反馈。原样本审稿页与进度保持独立。分数选填，未作选择始终记为未评。</footer><script>
function aiText(a){if(!a)return '初评尚未提供';const names={pass:'通过',fail:'未通过',pending:'待核实',not_applicable:'不适用'};return 'AI 判断：'+a.decision+'　加权分：'+a.weighted_score+'/100\n硬性检查：'+names[a.hard_status]+'\n'+dims.map(([id,n])=>n+' '+a.dimension_scores[id].score+'/5').join('　')+'\n\n依据：'+a.rationale+(a.suggested_change?'\n\n修改建议：'+a.suggested_change:'')+'\n\n此初评来自参与实现的助手，尚未获得人工认可。';} const labels=['可采用','需小改','需重写','不应发送','暂不确定'];const sceneNames={greeting:'生日与节日',recommendation:'产品推荐',post_purchase:'购后关怀',reactivation:'久违问候',invitation:'活动邀请',price_objection:'价格异议'};const dims=[['personalization','个人化'],['respect','尊重感'],['scenario','场景适配'],['emotional_value','情绪价值'],['brand','品牌一致'],['naturalness','微信自然度']];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,answers={},active,namespace;const qa=new URLSearchParams(location.search).get('qa')==='1';
function save(){try{localStorage.setItem(namespace,JSON.stringify(answers));status()}catch(e){document.querySelector('#feedback').textContent='自动保存失败，请立即导出 JSON。'}}
function status(){const all=Object.values(answers),n=all.filter(x=>x.decision).length;document.querySelector('#status').textContent=`${qa?'界面验收模式 · ':''}已评 ${n} / 150 条；固定抽检已评 ${data.cases.filter(c=>c.required).reduce((a,c)=>a+c.candidates.filter((_,i)=>answers[c.case_id+'-'+(i+1)]?.decision).length,0)} / 36 条。`}
function filtered(){let f=document.querySelector('#filter').value;return data.cases.filter(c=>f==='all'||(f==='sample'?c.required:c.important))}
function list(){let rows=filtered();if(!rows.some(c=>c.case_id===active))active=rows[0]?.case_id;document.querySelector('#caseList').innerHTML=rows.map(c=>`<button class="case-button ${active===c.case_id?'active':''}" data-case="${c.case_id}">${c.case_id} · ${esc(c.input.client.preferred_name)}<small>${sceneNames[c.input.scenario]} · ${c.candidates.filter((_,i)=>answers[c.case_id+'-'+(i+1)]?.decision).length}/3</small></button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{active=b.dataset.case;list();render()})}
function render(){const c=data.cases.find(c=>c.case_id===active);if(!c){document.querySelector('#main').textContent='此范围暂未列出案例。';return}const input=c.input,memory=c.memory;document.querySelector('#main').innerHTML=`<div class="topline"><div><div class="eyebrow">${c.case_id} / ${data.label}</div><h2>${sceneNames[input.scenario]}</h2><small>Run ${esc(c.run_id)} · ${esc(c.model)}</small></div><div><span class="tag">${c.required?'固定抽检':'扩展审阅'}</span></div></div><div class="notice">请先看客户当下的请求，再判断候选是否尊重事实、边界与个体差异。选择采用判断并留下关键批注即可；六维数字评分可选。结果不会发送给客户。</div><div class="context"><section class="panel"><h3>客户与已确认资料</h3><p>${esc(input.client.preferred_name)} · ${esc(input.client.lifecycle_stage)}<br>${esc(input.client.relationship)}</p><p>${esc((memory?.facts||[]).map(f=>f.topic+'：'+f.value).join('\n')||'尚无额外偏好资料')}</p><details><summary>背景、产品与场景事实</summary><p>${esc(JSON.stringify({background:input.client.background,products:c.products,scenario_details:input.scenario_details},null,2))}</p></details></section><section class="panel"><h3>本次对话</h3>${input.conversation_history.map(h=>`<p class="history"><small>${h.speaker==='client'?'客户':'顾问'}</small><br>${esc(h.text)}</p>`).join('')}</section></div><div class="candidates">${c.candidates.map((cand,i)=>{const key=c.case_id+'-'+(i+1),a=answers[key]||{};return `<section class="panel rating" data-key="${key}"><div class="candidate-number">CANDIDATE 0${i+1} · ${cand.message.length} 字</div><p class="message">${esc(cand.message)}</p><label>采用判断</label><select data-field="decision"><option value="">未评</option>${labels.map(l=>`<option ${a.decision===l?'selected':''}>${l}</option>`).join('')}</select><label>关键批注</label><textarea data-field="note" placeholder="哪些表达值得保留，哪些内容需要修改？">${esc(a.note||'')}</textarea><details><summary>选填：六维分数（1–5）</summary><div class="scores">${dims.map(([id,n])=>`<label>${n}<input type="number" min="1" max="5" step="1" data-score="${id}" value="${a.scores?.[id]||''}"></label>`).join('')}</div></details><details class="ai-details"><summary>查看 AI 初评（会记录已查看）</summary><div class="ai">${esc(aiText(cand.ai))}</div></details></section>`}).join('')}</div><div class="actions"><button id="next">保存并看下一组 →</button></div>`;
document.querySelectorAll('.rating').forEach(el=>{const key=el.dataset.key;function update(){const scores={};el.querySelectorAll('[data-score]').forEach(x=>{if(x.value&&Number.isInteger(+x.value)&&+x.value>=1&&+x.value<=5)scores[x.dataset.score]=+x.value});answers[key]={...answers[key],case_id:c.case_id,candidate_index:+key.split('-')[1],run_id:c.run_id,candidate_sha256:c.candidates[+key.split('-')[1]-1].message_sha256,decision:el.querySelector('select').value,note:el.querySelector('textarea').value,scores,updated_at:new Date().toISOString(),source:'human_review'};save();list()};el.querySelectorAll('select,textarea,input').forEach(x=>x.addEventListener('input',update));el.querySelector('.ai-details').addEventListener('toggle',e=>{if(e.target.open){update();answers[key]={...answers[key],ai_exposed:true};save()}})});document.querySelector('#next').onclick=()=>{const rows=filtered(),i=rows.findIndex(x=>x.case_id===active);active=rows[(i+1)%rows.length].case_id;list();render();scrollTo(0,0)}}
document.querySelector('#filter').onchange=()=>{list();render()};document.querySelector('#export').onclick=()=>{const result={schema_version:'formal-human-review-1.0',dataset_id:data.dataset_id,dataset_sha256:data.dataset_sha256,label:data.label,exported_at:new Date().toISOString(),qa,reviewer:'User',judgments:answers};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='序隅-正式审稿-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.qa!==qa||v.dataset_id!==data.dataset_id||v.dataset_sha256!==data.dataset_sha256)throw Error('数据集、版本或模式不同，未导入');const valid=new Map(data.cases.flatMap(c=>c.candidates.map((x,i)=>[c.case_id+'-'+(i+1),[c.run_id,x.message_sha256]])));for(const [k,a] of Object.entries(v.judgments)){const expected=valid.get(k);if(!expected||a.run_id!==expected[0]||a.candidate_sha256!==expected[1]||(a.decision&&!labels.includes(a.decision)))throw Error('候选关联校验失败')}answers={...answers,...v.judgments};save();list();render();document.querySelector('#feedback').textContent='已导入本版本的审稿。'}catch(err){document.querySelector('#feedback').textContent=err.message}};
fetch('dataset.json').then(r=>{if(!r.ok)throw Error('正式数据尚未生成');return r.json()}).then(v=>{data=v;namespace=(qa?'xuyu-formal-review-QA:':'xuyu-formal-review:')+data.dataset_sha256;try{answers=JSON.parse(localStorage.getItem(namespace)||'{}')}catch{answers={}}status();list();render()}).catch(e=>document.querySelector('#main').textContent=e.message);
</script></body></html>
